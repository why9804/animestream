name: Build AnimeStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract uploaded ZIP
      - name: Extract AnimeStream project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/animestream-android-ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: animestream-android-ready.zip not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PACKAGE=$(find "$GITHUB_WORKSPACE/source" \
            -type f -name package.json -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERROR: android/gradlew not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5. Setup Android SDK without interactive license prompt
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      # 6. Accept licenses automatically
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      # 7. Install required Android SDK
      - name: Install Android SDK 36
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 8. Install npm dependencies
      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 9. Build React / Vite application
      - name: Build web application
        run: |
          cd "$PROJECT_DIR"
          npm run build

      # 10. Sync Capacitor Android
      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      # 11. Build APK
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 12. Verify APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"

      # 13. Upload APK
      - name: Upload AnimeStream APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
