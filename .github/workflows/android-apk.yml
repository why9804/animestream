name: Build AnimeStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AnimeStream Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract uploaded ZIP
      - name: Extract AnimeStream project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/animestream-android-ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PACKAGE=$(find "$GITHUB_WORKSPACE/source" \
            -type f -name package.json -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      # 6. Accept Android SDK licenses
      - name: Accept SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "ERROR: Android SDK license acceptance failed"
            exit "$SDK_STATUS"
          fi

      # 7. Install SDK packages
      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 8. Install project dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 9. Check Capacitor and Android dependency
      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          CORE_VERSION=$(node -e "
            const p = require('./package.json');
            console.log(
              p.dependencies?.['@capacitor/core'] ||
              p.devDependencies?.['@capacitor/core'] || ''
            );
          ")

          if [ -z "$CORE_VERSION" ]; then
            echo "ERROR: @capacitor/core is missing from package.json"
            exit 1
          fi

          CORE_MAJOR=$(echo "$CORE_VERSION" | grep -oE '[0-9]+' | head -1)

          if [ -z "$CORE_MAJOR" ]; then
            echo "ERROR: Cannot determine Capacitor major version"
            exit 1
          fi

          echo "Capacitor core version: $CORE_VERSION"

          if ! node -e "require.resolve('@capacitor/android/package.json')" 2>/dev/null; then
            echo "Installing matching Capacitor Android package"
            npm install --no-save "@capacitor/android@$CORE_MAJOR"
          fi

          if [ ! -f android/gradlew ]; then
            echo "Android platform missing or incomplete."

            if [ -d android ]; then
              rm -rf android
            fi

            npx cap add android
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle wrapper was not generated"
            exit 1
          fi

          echo "Android platform ready."

      # 10. Build web application
      - name: Build web application
        run: |
          cd "$PROJECT_DIR"
          npm run build

      # 11. Sync Capacitor
      - name: Sync Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      # 12. Build debug APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
