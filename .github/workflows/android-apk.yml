name: Build AnimeStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AnimeStream Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract ZIP
      - name: Extract AnimeStream project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/animestream-android-ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PACKAGE=$(find "$GITHUB_WORKSPACE/source" \
            -type f -name package.json -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5. Configure preinstalled Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"
          "$SDKMANAGER" --version

      # 6. Accept SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            || test "${PIPESTATUS[1]}" -eq 0

      # 7. Install Android SDK packages
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 8. Install dependencies
      - name: Install npm dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 9. Prepare Capacitor Android
      - name: Prepare Android platform
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          CORE_VERSION=$(node -e "
            const p = require('./package.json');
            console.log(
              p.dependencies?.['@capacitor/core'] ||
              p.devDependencies?.['@capacitor/core'] || ''
            );
          ")

          if [ -z "$CORE_VERSION" ]; then
            echo "ERROR: @capacitor/core missing"
            exit 1
          fi

          CORE_MAJOR=$(echo "$CORE_VERSION" | grep -oE '[0-9]+' | head -1)

          if [ -z "$CORE_MAJOR" ]; then
            echo "ERROR: Invalid Capacitor version: $CORE_VERSION"
            exit 1
          fi

          if ! node -e "require.resolve('@capacitor/android/package.json')" 2>/dev/null; then
            npm install --no-save "@capacitor/android@$CORE_MAJOR"
          fi

          if [ ! -f android/gradlew ]; then
            echo "Generating Android platform..."

            if [ -d android ]; then
              rm -rf android
            fi

            npx cap add android
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Gradle wrapper missing"
            exit 1
          fi

          echo "Android platform ready"

      # 10. Build web application
      - name: Build web application
        run: |
          cd "$PROJECT_DIR"
          npm run build

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      # 12. Build APK
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          ls -lh "$APK"
          file "$APK"

      # 14. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
